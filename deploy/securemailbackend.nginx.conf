# Secure Mail API site for the existing shared nginx http context.
# Confirm the actual Certbot lineage paths before installation.
# Stage in sites-available only until the shared nginx uses OpenSSL 3.5+.
# Requires nginx linked to OpenSSL >=3.5, verified X25519MLKEM768 support.
# Direct EC2 ingress: if a load balancer is added, re-review trust and PQ evidence.
server {
    listen 443 ssl;
    server_name securemailbackend.onesmarter.com;
    if ($ssl_server_name != "securemailbackend.onesmarter.com") { return 421; }
    ssl_certificate /etc/letsencrypt/live/securemailbackend.onesmarter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/securemailbackend.onesmarter.com/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768;
    ssl_session_tickets off;
    ssl_session_cache off;
    ssl_early_data off;
    client_max_body_size 27m;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # Separate integration mTLS must be provisioned before enabling this endpoint.
    location = /api/integrations/threads { return 403; }
    # Custodian gateway is provisioned separately; never proxy raw key-service APIs.
    location = /maintenance { return 404; }
    location ^~ /maintenance/ { return 404; }
    location = /api/dev/inbox { return 404; }
    location = /api/auth/setup { return 404; }
    location ~ ^/(api|recipient-api)/ {
        proxy_pass http://unix:/run/onesmarter/app.sock:;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
    location / { return 404; }
}
