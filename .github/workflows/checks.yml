name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dependency-hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - name: Verify complete locks and actual Docker hash rejection
        run: python scripts/check_dependency_hashes.py --docker
      - name: Retain hash-check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-hash-evidence
          path: .runtime/dependency-hashes-*/*.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  pq-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      RUN_PQ_TRANSPORT: "1"
      RUN_KEY_SERVICE_LOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build verified PQ runtime (Python and OpenSSL together)
        run: docker build --build-arg INSTALL_TEST_DEPENDENCIES=1 -f deploy/Dockerfile.pq -t securemail-pq-test .
      - name: Test actual hybrid TLS and key-service load
        run: |
          docker run --rm --user root -v "$PWD:/app" -e APP_ENV -e RUN_PQ_TRANSPORT -e RUN_KEY_SERVICE_LOAD securemail-pq-test sh -ec '
            python scripts/init_local.py
            python scripts/check_pq_transport.py
            pytest backend/tests/test_production_startup.py backend/tests/test_keyservice.py backend/tests/test_pq_transport.py backend/tests/test_security_acceptance.py backend/tests/test_candidate_audit.py backend/tests/test_candidate_decisions.py backend/tests/test_checkpoint_transport.py backend/tests/test_mutable_field_rollback.py backend/tests/test_recovery_evidence.py backend/tests/test_s3_checkpoints.py -q
            cat .runtime/key-service-load.json
          '
  proxy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      REQUIRE_NGINX_TEST: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - run: python scripts/init_local.py
      - run: pytest backend/tests/test_rate_limits.py backend/tests/test_proxy_integration.py backend/tests/test_pq_ingress.py backend/tests/test_integration_ingress.py -q
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: secure_mail
          POSTGRES_USER: secure_mail
          # Ephemeral isolated CI database only; no external credentials.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U secure_mail" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_DB: secure_mail
      POSTGRES_USER: secure_mail
      POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          {
            python-version: "3.12",
            cache: pip,
            cache-dependency-path: requirements.lock,
          }
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock -r requirements-test.lock"
      - run: python scripts/init_local.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: pytest -q
  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --strict -r requirements.lock -r requirements-test.lock

  security-scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - run: pip install bandit==1.9.4
      - run: bandit -r backend/apps backend/keyservice backend/transport -lll -f json -o bandit.json
      - name: Reject incomplete static analysis
        run: python -c "import json; report=json.load(open('bandit.json')); assert not report['errors'], 'Bandit did not scan all files'"
      - name: Scan repository history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /repo --redact --exit-code 1
      - run: docker build -t securemail-backend:scan .
      - run: docker build -f deploy/Dockerfile.pq -t securemail-pq:scan .
      - name: Reject high and critical container vulnerabilities
        run: |
          failed=0
          for image in securemail-backend:scan securemail-pq:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --exit-code 1 --severity HIGH,CRITICAL "$image" || failed=1
          done
          exit "$failed"
      - name: Export scanned images and SPDX inventories
        run: python scripts/export_image_evidence.py
      - name: Retain images, SBOMs and digest manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-image-evidence
          path: .runtime/image-evidence/
          include-hidden-files: true
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  image-attestations:
    # PR code cannot obtain an OIDC signing token. Pushes attest only artifacts
    # from this run, after all validation jobs pass; nothing is published to GHCR.
    if: github.event_name == 'push'
    needs: [dependency-hashes, backend, pq-transport, proxy, python-dependency-audit, security-scanners]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: scanned-image-evidence
          path: image-evidence
      - name: Attest exact saved-image archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: image-evidence/*.image.tar
      - name: Attest backend SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: image-evidence/backend.image.tar
          sbom-path: image-evidence/backend.spdx.json
      - name: Attest PQ-service SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: image-evidence/pq.image.tar
          sbom-path: image-evidence/pq.spdx.json
